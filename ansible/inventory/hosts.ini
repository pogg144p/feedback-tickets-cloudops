# inventory/hosts.ini
# ─────────────────────────────────────────────────────────────
# Defines server groups and connection details.
# Replace IP addresses with your actual EC2 public/private IPs.
# ─────────────────────────────────────────────────────────────

[webservers]
# Example EC2 instance running Nginx / Web frontend
web-01 ansible_host=3.85.120.45 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/tata-strive-key.pem

[appservers]
# Example EC2 instances running Docker application workloads
app-01 ansible_host=3.85.120.46 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/tata-strive-key.pem
app-02 ansible_host=3.85.120.47 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/tata-strive-key.pem

[all:children]
webservers
appservers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
environment_name=production
