# .github/workflows/ci.yml
name: CI - Code Quality & Testing

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, dev ]

jobs:
  python-tests:
    name: Run Python Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 boto3

      - name: Lint Code with Flake8
        run: |
          flake8 lambdas/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 lambdas/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Unit Tests
        run: |
          pytest tests/ -v

  terraform-lint:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check terraform/

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform
