# monitoring/prometheus.yml
# ─────────────────────────────────────────────────────────────
# Prometheus Scrape Configuration
#
# Configures Prometheus to scrape metrics from the Pushgateway
# every 5 seconds.
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Load alerting rules once and periodically evaluate them according to 'evaluation_interval'
rule_files:
  - 'alerts.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pushgateway'
    honor_labels: true # Preserves metric labels pushed by Lambda
    static_configs:
      - targets: ['pushgateway:9091']
