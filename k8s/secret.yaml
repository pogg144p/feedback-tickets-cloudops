apiVersion: v1
kind: Secret
metadata:
  name: tickets-app-secrets
  namespace: tickets-cloudops
  labels:
    app: tickets-app
type: Opaque
# Base64 encoded or plaintext stringData for easy deployment
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_KEY"
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
